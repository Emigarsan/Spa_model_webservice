name: Despertar app Render

on:
  workflow_dispatch:

jobs:
  wake:
    runs-on: ubuntu-latest
    steps:
      - name: Ping hasta que responda
        run: |
          for i in $(seq 1 10); do
            if curl -sf --max-time 90 https://spa-occupancy-backend-y2wk.onrender.com/health; then
              echo "App despierta"
              exit 0
            fi
            echo "Intento $i fallido, reintentando..."
            sleep 20
          done
          exit 1
